name: alter_ego
description: "The Alter Ego App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  fl_chart: ^1.1.1
  intl: ^0.18.0
  flutter_lints: ^6.0.0
  flutter_animate: ^4.5.2
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  crypto: ^3.0.7
  http: ^1.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4


flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/alterEgoIcon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/alterEgoIcon.png"


flutter_native_splash:
  color: "#000000"
  image: "assets/images/alterEgoIcon.png"
  ios: true
  android: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/