name: alter_ego
description: "The Alter Ego App"

publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  shared_preferences: ^2.3.5
  fl_chart: ^1.2.0
  intl: ^0.20.3
  flutter_lints: ^6.0.0
  flutter_animate: ^4.5.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  crypto: ^3.0.7
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: ^0.4.11
  url_launcher: ^6.3.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/alterEgoIcon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/alterEgoIcon.png"


flutter_native_splash:
  color: "#000000"
  image: "assets/images/alterEgoIcon.png"
  ios: true
  android: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/